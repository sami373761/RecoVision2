<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern 3D Carousel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f8f8;
    }

    /* Carousel Container */
    .carousel-container {
      position: relative;
      width: 800px;
      height: 500px;
      margin: 50px auto;
      perspective: 1200px; /* 3D perspektif */
      background: #fff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      border-radius: 10px;
      overflow: hidden;
    }

    /* Carousel Wrapper */
    .carousel {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease; /* Genel dönme/konum değişikliği transition */
    }

    /* Tek tek slayt */
    .slide {
      position: absolute;
      width: 70%;
      height: 70%;
      top: 15%;
      left: 15%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      transition:
        transform 0.5s ease,
        opacity 0.5s ease;
      /* Slaytlar transform ile 3D’de konumlandırılacak */
    }

    /* Sol - Sağ Butonlar */
    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.7);
      border: none;
      cursor: pointer;
      font-size: 2rem;
      padding: 0.5rem 1rem;
      border-radius: 50%;
      z-index: 10;
      transition: background 0.3s;
    }
    .nav:hover {
      background: rgba(255,255,255,0.9);
    }
    .nav.prev {
      left: 15px;
    }
    .nav.next {
      right: 15px;
    }

    /* Alttaki Göstergeler (Dots) */
    .indicators {
      position: absolute;
      bottom: 15px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 10;
    }
    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin: 0 4px;
      border-radius: 50%;
      background: #aaa;
      cursor: pointer;
      transition: background 0.3s;
    }
    .dot:hover {
      background: #888;
    }
    .dot.active {
      background: #333;
    }
  </style>
</head>
<body>
  <div>
    <img src="logo_refined.svg" alt="Logo" width="100" height="100">
  </div>

  <div class="carousel-container">
    <!-- Carousel Wrapper -->
    <div class="carousel">
      <!-- Örnek slaytlar -->
      <div class="slide" style="background-image: url('https://picsum.photos/id/1011/800/500');"></div>
      <div class="slide" style="background-image: url('https://picsum.photos/id/1015/800/500');"></div>
      <div class="slide" style="background-image: url('https://picsum.photos/id/1016/800/500');"></div>
      <div class="slide" style="background-image: url('https://picsum.photos/id/1019/800/500');"></div>
      <div class="slide" style="background-image: url('https://picsum.photos/id/1022/800/500');"></div>
    </div>

    <!-- Gezinti Butonları -->
    <button class="nav prev">&#10094;</button>
    <button class="nav next">&#10095;</button>

    <!-- Alt Göstergeler (Dots) -->
    <div class="indicators"></div>
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const prevBtn = document.querySelector('.prev');
    const nextBtn = document.querySelector('.next');
    const indicators = document.querySelector('.indicators');

    let currentIndex = 0;
    const totalSlides = slides.length;

    for (let i = 0; i < totalSlides; i++) {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (i === 0) dot.classList.add('active'); 
      
      dot.addEventListener('click', () => {
        currentIndex = i;
        updateCarousel();
      });
      indicators.appendChild(dot);
    }

    function updateCarousel() {
      slides.forEach((slide, index) => {
        // Slaytın aktif slayttan uzaklığı
        // (distance = 0 => merkez, distance = ±1 => yan slaytlar vs.)
        let distance = index - currentIndex;

        // Son slayttan ilk slayda veya tersi yöndeki geçişi
        // mod işlemiyle döngüsel kılmak istersek:
        // distance = (index - currentIndex + totalSlides) % totalSlides;
        // Yukarıdaki gibi bir hesap da yapılabilir; bu örnekte basit şekilde ilerliyoruz.

        // Merkez (aktif) slayt
        if (distance === 0) {
          slide.style.transform = "translateX(0) translateZ(200px) scale(1)";
          slide.style.opacity = "1";
          slide.style.zIndex = 2;

        // Solundaki slayt (distance = -1) 
        // veya (distance = totalSlides - 1) => sondan başa
        } else if (distance === -1 || distance === (totalSlides - 1)) {
          slide.style.transform = "translateX(-150px) translateZ(0px) rotateY(15deg) scale(0.9)";
          slide.style.opacity = "0.5";
          slide.style.zIndex = 1;

        // Sağındaki slayt (distance = 1)
        // veya (distance = -(totalSlides - 1))
        } else if (distance === 1 || distance === -(totalSlides - 1)) {
          slide.style.transform = "translateX(150px) translateZ(0px) rotateY(-15deg) scale(0.9)";
          slide.style.opacity = "0.5";
          slide.style.zIndex = 1;

        // Diğer tüm slaytlar (arka plana at)
        } else {
          slide.style.transform = "translateX(0) translateZ(-200px) scale(0.8)";
          slide.style.opacity = "0";
          slide.style.zIndex = 0;
        }
      });

      // Dot (gösterge) güncelleme
      const dots = indicators.querySelectorAll('.dot');
      dots.forEach((dot, i) => {
        dot.classList.remove('active');
        if (i === currentIndex) {
          dot.classList.add('active');
        }
      });
    }

    // Buton olayları
    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
      updateCarousel();
    });

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % totalSlides;
      updateCarousel();
    });

    // Sayfa açıldığında ilk konumu göster
    updateCarousel();
  </script>
</body>
</html>
