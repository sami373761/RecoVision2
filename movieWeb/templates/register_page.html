<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <style>
      body {
        background: linear-gradient(to left bottom,rgb(34, 23, 43),rgb(13, 34, 47), rgb(25, 46, 36));
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        color: #333;
        font-family: "Poppins", sans-serif;
      }
      .card {
        border: none;
        border-radius: 12px;
        background-color: #fff;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: rgb(75, 51, 94);
        font-weight: 600;
      }
      .form-label {
        font-weight: 500;
        color: rgb(75, 51, 94);

      }
      .form-control {
        border-radius: 8px;
        border: 1px solid #ced4da;
      }
      .form-control:focus {
        box-shadow: none;
        border-color: rgb(75, 51, 94);

      }
      .btn-custom {
        background-color:rgb(75, 51, 94);
        color: #fff; 
        border-radius: 8px;
        border: none;
        transition: all 0.3s ease;
      }
      .btn-custom:hover {
        background-color:  rgb(102, 70, 128);
      }
      .link-text {
        color:  rgb(75, 51, 94);
        text-decoration: none;
        font-size: 0.9rem;
      }
      .link-text:hover {
        text-decoration: underline;
      }
  </style>
    
  
  
  
    
</head>
<body>
    <div class="container px-3">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card p-4">
            <h2 class="text-center mb-4">Register</h2>
            <form method="POST">
              {% csrf_token %}
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input 
                  type="text" 
                  name="username" 
                  id="username" 
                  class="form-control" 
                  placeholder="Enter your username" 
                  required
                >
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input 
                  type="email" 
                  name="email" 
                  id="email" 
                  class="form-control" 
                  placeholder="Enter your email" 
                  required
                >
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input 
                  type="password" 
                  name="password" 
                  id="password" 
                  class="form-control" 
                  placeholder="Enter your password" 
                  required
                >
              </div>
              <div class="mb-3">
                <label for="repassword" class="form-label">Confirm Password</label>
                <input 
                  type="password" 
                  name="repassword" 
                  id="repassword" 
                  class="form-control" 
                  placeholder="Re-enter your password" 
                  required
                >
              </div>
              <button type="submit" class="btn btn-custom w-100 mb-3">Register</button>
              <div class="text-center">
                <a href="{% url 'login' %}" class="link-text">Already have an account? Login</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
